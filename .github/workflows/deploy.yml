name: Auto-increment version

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pages: write

concurrency:
  group: yaya-version-bump
  cancel-in-progress: false

jobs:
  increment-version:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync latest main
        run: |
          git fetch origin main
          git checkout main
          git pull --ff-only origin main

      - name: Increment and synchronize visible Yaya version
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('version.txt')
          current = p.read_text(encoding='utf-8').strip() if p.exists() else '205.3'
          m = re.fullmatch(r'(\d+)\.(\d+)', current)
          if not m:
              raise SystemExit(f'Version invalide: {current!r}')

          new_version = f'{int(m.group(1))}.{int(m.group(2)) + 1}'
          minor = new_version.split('.')[-1]
          p.write_text(new_version + '\n', encoding='utf-8')
          Path('VERSION.txt').write_text('v' + new_version + '\n', encoding='utf-8')

          # V34 : la date de signature appartient à dateSignature, jamais à notes.
          guard_path = Path('chantier-write-safety.js')
          if guard_path.exists():
              guard = guard_path.read_text(encoding='utf-8')
              guard = guard.replace(
                  "  function notesWithSignature(notes,signature){\n    const clean=cleanNotes(notes);\n    const sig=signatureMonth(signature);\n    if(!sig)return clean;\n    return (clean?'\\n':'')+'[[YAYA_SIG:'+sig+']]';\n  }",
                  "  function notesWithSignature(notes,signature){\n    return cleanNotes(notes);\n  }"
              )
              guard = guard.replace(
                  '      merged.notes=notesWithSignature(merged.notes,incoming.dateSignature);',
                  '      merged.notes=cleanNotes(merged.notes);'
              )
              guard_path.write_text(guard, encoding='utf-8')

          for filename in ('index.html', 'public/index.html', 'index-production-base.html', 'index-legacy.html'):
              path = Path(filename)
              if not path.exists():
                  continue
              text = path.read_text(encoding='utf-8')
              text, count = re.subn(
                  r'<title>Yaya v[^<]+ — AB RENOV 35</title>',
                  f'<title>Yaya v{new_version} — AB RENOV 35</title>',
                  text,
                  count=1,
                  flags=re.I,
              )
              if filename == 'index.html':
                  text = text.replace(
                      'chantier-write-safety.js?v=writeguard-7',
                      'chantier-write-safety.js?v=writeguard-8'
                  )
                  text = text.replace(
                      'chantier-write-safety.js?v=writeguard-2',
                      'chantier-write-safety.js?v=writeguard-8'
                  )
                  text = text.replace(
                      'chantier-planning-status-fix.js?v=planningstatus-7',
                      'chantier-planning-status-fix.js?v=planningstatus-8'
                  )
                  text = text.replace(
                      'chantier-signature-before-sept.js?v=beforesept-1',
                      'chantier-signature-before-sept.js?v=beforesept-3'
                  )
                  text = text.replace(
                      'chantier-signature-before-sept.js?v=beforesept-2',
                      'chantier-signature-before-sept.js?v=beforesept-3'
                  )
                  text = text.replace(
                      'devis-delete-confirm.js?v=devisconfirm-1',
                      'devis-delete-confirm.js?v=devisconfirm-2'
                  )
                  text = re.sub(
                      r'finance-edit-actions-fix\.js\?v=financeeditactions-[^"<\\]+',
                      f'finance-edit-actions-fix.js?v=financeeditactions-{minor}',
                      text
                  )
                  text = re.sub(
                      r'devis-no-ai-upload\.js\?v=[^"<\\]+',
                      f'devis-no-ai-upload.js?v=noai-{minor}',
                      text
                  )
                  if 'chantier-signature-before-sept.js' not in text:
                      prefix = "    '<script src=\"chantier-write-safety.js?v=writeguard-8\">"
                      injected = "    '<script src=\"chantier-signature-before-sept.js?v=beforesept-3\"><\\\\/script>'+\n" + prefix
                      if prefix not in text:
                          raise SystemExit('Point insertion V37 introuvable')
                      text = text.replace(prefix, injected, 1)
              path.write_text(text, encoding='utf-8')

          print(f'Yaya {current} -> {new_version}')
          PY

      - name: Commit & push version
        run: |
          git config user.email "github-actions@github.com"
          git config user.name "GitHub Actions"
          git add version.txt VERSION.txt index.html public/index.html index-production-base.html index-legacy.html chantier-write-safety.js
          git commit -m "Bump Yaya visible version" || echo "No change"
          git push

      - name: Trigger GitHub Pages build for bumped version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sleep 2
          curl --fail-with-body -L \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages/builds"
