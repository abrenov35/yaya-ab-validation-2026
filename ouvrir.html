<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Ouvrir Yaya 2 TEST</title>
<style>
html,body{margin:0;min-height:100%;background:#eef1f4;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#17263a}
main{min-height:100vh;display:grid;place-items:center;padding:24px;box-sizing:border-box}
.card{background:#fff;border:1px solid #dfe4e9;border-radius:12px;padding:24px;max-width:420px;width:100%;box-sizing:border-box;text-align:center}
.mark{width:52px;height:52px;margin:0 auto 14px;border-radius:10px;background:#14263d;color:#fff;display:grid;place-items:center;font-weight:800}
h1{font-size:20px;margin:0 0 8px}p{font-size:13px;color:#6d7785;margin:0 0 18px;line-height:1.45}
button{border:0;border-radius:8px;background:#14263d;color:#fff;padding:12px 16px;font-weight:700;font-size:14px;width:100%}
</style>
</head>
<body>
<main><div class="card">
<div class="mark">AB</div>
<h1>Yaya 2 TEST</h1>
<p>Ouverture d'une nouvelle session TEST à partir des données Yaya.</p>
<button id="open">Ouvrir Yaya 2</button>
</div></main>
<script>
(function(){
  function go(){ location.href="./index.html?session="+Date.now(); }
  document.getElementById("open").onclick=go;
  setTimeout(go,120);
})();
</script>
</body>
</html>
